<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股简单! - deva的交易修行场</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="hs300_list.js"></script>
<script src="decoder.js"></script>
<style>
:root {
    --pink: #f69;
    --pink-deep: #e84b85;
    --up: #f85a54;    /* A股红涨 */
    --down: #2ac864;  /* A股绿跌 */
    --bg: #000;
    --card: #141416;
    --card2: #1d1d20;
    --line: #2a2a2e;
    --text: #fff;
    --text2: #9499a0;
    --text3: #61666d;
    --gold: #ffb020;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}
#app { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }

/* ===== 顶部 ===== */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
.brand h1 .accent { color: var(--pink); }
.brand .sub { font-size: 12px; color: var(--text2); }
.nav-btns { display: flex; gap: 10px; }
.nav-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 8px 18px; border-radius: 999px; font-size: 14px; cursor: pointer; transition: .15s;
}
.nav-btn:hover { border-color: var(--pink); color: var(--pink); }
.nav-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }

/* ===== deva 台词卡片 ===== */
.deva-bar {
    display: flex; gap: 12px; align-items: flex-start;
    background: linear-gradient(135deg, #1a1218, var(--card));
    border: 1px solid #3a2430; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
}
.deva-avatar {
    flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8cb0, #d03171);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px; color: #fff; letter-spacing: .5px;
    box-shadow: 0 0 14px #f6969666;
}
.deva-say { flex: 1; min-width: 0; }
.deva-say .who { font-size: 12px; color: var(--pink); font-weight: 700; margin-bottom: 2px; }
.deva-say .who::after { content: " · 全职交易大师"; color: var(--text3); font-weight: 400; }
.deva-say .txt { font-size: 14px; color: #ffd9e4; }

/* ===== 面板通用 ===== */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.panel-title { font-size: 13px; color: var(--text2); font-weight: 700; margin-bottom: 12px; letter-spacing: 1px; }
.hidden-tag {
    display: inline-block; background: #2b1a22; color: var(--pink); border: 1px dashed #5c3646;
    border-radius: 6px; padding: 1px 8px; font-size: 12px; margin-left: 8px; font-weight: 400;
}

/* ===== 图表 ===== */
#chart { width: 100%; height: 380px; }
.chart-mask-note { font-size: 12px; color: var(--text3); text-align: center; padding-top: 4px; }

/* ===== 数据行 ===== */
.stat-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.stat {
    flex: 1; min-width: 130px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
}
.stat .k { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.stat .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat .v.up { color: var(--up); }
.stat .v.down { color: var(--down); }
.stat .v.gold { color: var(--gold); }
.stat .v.pink { color: var(--pink); }

/* ===== 决策按钮(悬浮底栏) ===== */
.decide-wrap { text-align: center; padding: 6px 0 2px; }
.dock {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 0; width: min(1000px, 100%);
    background: rgba(20, 20, 22, 0.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    text-align: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    z-index: 40; box-shadow: 0 -8px 32px #000a;
}
.dock-space { height: 170px; } /* 给悬浮栏留位, 避免遮挡内容 */
.back-game-btn { border-color: var(--pink) !important; color: var(--pink) !important; }
.decide-q { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
.decide-q .day-no { color: var(--pink); }
.decide-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.big-btn {
    border: none; cursor: pointer; border-radius: 14px; padding: 16px 34px;
    font-size: 17px; font-weight: 800; letter-spacing: 2px; transition: .12s; color: #fff;
}
.big-btn:active { transform: scale(.96); }
.big-btn.buy { background: linear-gradient(160deg, #ff6f68, #e23d3d); box-shadow: 0 4px 18px #f85a5455; }
.big-btn.buy:hover { box-shadow: 0 4px 24px #f85a5488; }
.big-btn.sell { background: linear-gradient(160deg, #3fd97a, #1e9e4e); box-shadow: 0 4px 18px #2ac86455; }
.big-btn.sell:hover { box-shadow: 0 4px 24px #2ac86488; }
.big-btn.hold { background: var(--card2); border: 1px solid var(--line); color: var(--text2); box-shadow: none; }
.big-btn.hold:hover { color: var(--text); border-color: var(--text3); }
.size-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
.size-btn {
    border: 1px solid var(--line); background: var(--card2); color: var(--text);
    border-radius: 999px; padding: 10px 22px; font-size: 14px; cursor: pointer; transition: .12s;
}
.size-btn:hover { border-color: var(--pink); }
.size-btn.sel-buy { background: var(--up); border-color: var(--up); font-weight: 700; }
.size-btn.sel-sell { background: var(--down); border-color: var(--down); font-weight: 700; }
.custom-input {
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card2);
    border-radius: 999px; padding: 6px 6px 6px 16px;
}
.custom-input input {
    width: 70px; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 14px; text-align: right;
}
.custom-input .pct { color: var(--text2); margin-right: 8px; }
.custom-input button {
    border: none; border-radius: 999px; background: var(--pink); color: #fff;
    padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 700;
}
.hint { font-size: 12px; color: var(--text3); margin-top: 12px; }
.dock .hint { margin-top: 8px; }
.dock .decide-q { margin-bottom: 10px; }
.dock .big-btn { padding: 13px 30px; font-size: 16px; }
.next-day-btn {
    margin-top: 14px; border: none; cursor: pointer; border-radius: 999px;
    background: linear-gradient(135deg, #00aeec, #0077c8); color: #fff;
    padding: 12px 44px; font-size: 16px; font-weight: 800; letter-spacing: 2px;
    box-shadow: 0 4px 18px #00aeec44;
}

/* ===== 逐日行情表 ===== */
.day-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.day-table th { color: var(--text3); font-weight: 400; text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.day-table th:first-child, .day-table td:first-child { text-align: left; }
.day-table td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #1c1c1f; font-variant-numeric: tabular-nums; }
.day-table tr.today-row td { background: #241a1f; color: var(--pink); font-weight: 700; }
.day-table td.up { color: var(--up); }
.day-table td.down { color: var(--down); }
.table-scroll { max-height: 260px; overflow-y: auto; }
.table-scroll::-webkit-scrollbar { width: 6px; }
.table-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* ===== 揭晓 ===== */
.reveal-name { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
.reveal-name .code { color: var(--text3); font-size: 15px; font-weight: 400; }
.reveal-range { font-size: 13px; color: var(--text2); margin-bottom: 14px; }
.verdict { font-size: 15px; padding: 10px 0; font-weight: 700; }

/* ===== 记录页 ===== */
.rec-summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.rec-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rec-table th { color: var(--text3); font-weight: 400; text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rec-table td { text-align: right; padding: 8px; border-bottom: 1px solid #1c1c1f; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rec-table th:first-child, .rec-table td:first-child { text-align: left; }
.rec-table td.up { color: var(--up); }
.rec-table td.down { color: var(--down); }
.empty-tip { text-align: center; color: var(--text3); padding: 40px 0; font-size: 14px; }
.danger-btn { border: 1px solid #5c2626; background: transparent; color: #c96b6b; border-radius: 999px; padding: 6px 16px; cursor: pointer; font-size: 12px; margin-top: 14px; }
.danger-btn:hover { background: #2b1515; }

/* ===== 开局页 ===== */
.start-hero { text-align: center; padding: 40px 0 20px; }
.start-hero h2 { font-size: 34px; font-weight: 900; letter-spacing: 2px; }
.start-hero h2 .accent { color: var(--pink); }
.start-hero p { color: var(--text2); margin-top: 10px; font-size: 14px; }
.start-btn {
    margin-top: 26px; border: none; cursor: pointer; border-radius: 16px;
    background: linear-gradient(135deg, #ff8cb0, #d03171); color: #fff;
    padding: 18px 64px; font-size: 20px; font-weight: 900; letter-spacing: 4px;
    box-shadow: 0 6px 28px #f6944; box-shadow: 0 6px 28px #f6969666;
}
.start-btn:active { transform: scale(.97); }
.loading-tip { text-align: center; color: var(--text2); padding: 50px 0; }
.loading-tip .spin {
    display: inline-block; width: 28px; height: 28px; border: 3px solid var(--line);
    border-top-color: var(--pink); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.rules-list { text-align: left; max-width: 520px; margin: 24px auto 0; color: var(--text2); font-size: 13px; line-height: 2; }
.rules-list b { color: var(--text); }

.toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
    background: #2b2b30; color: #fff; border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 22px; font-size: 14px; z-index: 99;
    box-shadow: 0 8px 30px #000c; animation: drop .25s;
}
@keyframes drop { from { top: -40px; opacity: 0; } }

@media (max-width: 640px) {
    .big-btn { padding: 14px 22px; font-size: 15px; }
    .stat { min-width: 100px; }
    #chart { height: 300px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
</body>
</html>
