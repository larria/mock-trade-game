<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173d32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="A股简单">
  <meta name="description" content="A股简单 · 交易修行场。沪深300、中证500、科创板、创业板历史行情盲图训练，用技术分析与交易纪律建立自己的交易系统。">
  <title>A股简单 · 交易修行场</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23173d32'/%3E%3Cpath d='M13 44 25 30 34 36 51 17M40 17h11v11' stroke='%23d2edb1' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/echarts.min.js"></script>
  <script defer src="stock-universe.js"></script>
  <script defer src="decoder.js"></script>
  <script defer src="engine.js"></script>
  <script defer src="chart-studies.js"></script>
  <script defer src="chart-drawing.js"></script>
  <script defer src="market-chart.js"></script>
  <script defer src="chart-controls.js"></script>
  <script defer src="version.js"></script>
  <script defer src="pwa.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <div id="app"></div>
  <section id="quick-trade" class="quick-trade" aria-label="极简交易" hidden>
    <div class="quick-trade-inner">
      <div class="quick-trade-status"><span id="quick-trade-day" class="num"></span><span id="quick-trade-feedback" role="status"></span></div>
      <div class="quick-trade-actions">
        <button type="button" data-action="quick-trade" data-order="buy">全买</button>
        <button type="button" data-action="quick-trade" data-order="sell">全卖</button>
        <button type="button" data-action="quick-trade" data-order="hold" class="quick-hold">持币</button>
      </div>
    </div>
  </section>
  <dialog class="confirm-dialog pwa-update-dialog" id="pwa-update-dialog" aria-labelledby="pwa-update-title">
    <h2 id="pwa-update-title"></h2>
    <p>确认更新后会保存当前对局和交易草稿，再重新打开应用。</p>
    <ul id="pwa-update-notes" aria-label="更新内容"></ul>
    <form method="dialog" class="dialog-buttons">
      <button class="btn" value="cancel" autofocus>稍后</button>
      <button class="btn primary" value="apply">保存并更新</button>
    </form>
  </dialog>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript 后进入交易修行场。</noscript>
</body>
</html>
